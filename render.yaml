databases:
  - name: completcont-db
    plan: free

services:
  - type: web
    name: completcont
    runtime: python
    plan: free
    rootDir: .
    buildCommand: |
      set -e
      # 1) build the React frontend
      cd my-complet-cont
      npm ci
      VITE_API_BASE="" VITE_WS_BASE="" npm run build
      cd ..
      # 2) move build output to a path the backend serves
      rm -rf backend/frontend_dist
      mv my-complet-cont/dist backend/frontend_dist
      # 3) install backend deps
      pip install -r backend/requirements.txt
    startCommand: |
      cd backend
      alembic upgrade head
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*" --workers 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: completcont-db
          property: connectionString
      - key: FRONTEND_DIST
        value: /opt/render/project/src/backend/frontend_dist
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false        # set to the live Render URL after first deploy
      - key: MONGO_URL
        sync: false        # set to the Atlas connection string (see RENDER_ATLAS_SETUP.md)
      - key: MONGO_DB
        value: completcont_chat
      - key: MAILTRAP_HOST
        sync: false
      - key: MAILTRAP_PORT
        sync: false
      - key: MAILTRAP_USERNAME
        sync: false
      - key: MAILTRAP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
